note: >-
  REPLACES the 2026-05-04 bulk-sweep scaffold, which carried invented per-tier numbers
  (10/100/1000 rpm, 1k/100k monthly quotas) that Contify has never published. Those values
  were fabricated defaults and have been removed. Contify publishes NO rate-limit numbers,
  no window, no burst ceiling, no response headers and no exhaustion status code. The only
  public statement is that limits are configurable per subscription tier. An honest zero is
  data; a plausible invented limit is not.
