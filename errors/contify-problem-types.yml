note: >-
  Contify publishes no OpenAPI and no public error reference — the API reference is behind
  the developer.contify.com login — so nothing here is derived from a spec. Each entry
  below was observed on a live request on 2026-09-05 and carries the exact body returned.
  This is a partial catalogue of the unauthenticated surface only; the authenticated
  error set (validation, quota, throttling) could not be observed and is NOT guessed at.
