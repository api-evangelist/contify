source: live unauthenticated requests against https://api.contify.com/v4.1/
format: custom
rfc9457: false
envelope:
  shape: '{"detail": "<human-readable message>"}'
  content_type: application/json
  field: detail
  note: >-
    The Django REST Framework default error envelope. There is no `type`, `title`,
    `status`, `instance` or `errors[]` member, so this is NOT RFC 9457
